profile: claude-app
label: Claude 앱 (Cowork · claude.ai · 데스크톱)
description_max: 200
frontmatter_allow: [name, description, license, metadata]
flags: [python_only, net_scripts, web, no_subagents, files]
toolkit_cmd: "scripts -m refver"
toolkit_dir: "scripts"
install: |
  1. 설정 → 기능에서 **코드 실행 및 파일 생성**을 켠다.
  2. Cowork → 맞춤설정 → 스킬 → ＋ → 스킬 업로드에서 `orange-check-claude-app.zip`을 올린다.
  3. 목록에 나타나면 토글을 켠다.
package: zip
