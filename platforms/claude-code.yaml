profile: claude-code
label: Claude Code (CLI · 데스크톱 앱)
description_max: 1024
frontmatter_allow: [name, description, license, allowed-tools, metadata]
extra_frontmatter:
  allowed-tools: "Bash(python3:*) Read Write Glob Grep WebSearch WebFetch Skill"
flags: [shell, net_scripts, web, subagents, files]
toolkit_cmd: "${CLAUDE_SKILL_DIR}/scripts -m refver"
toolkit_dir: "${CLAUDE_SKILL_DIR}/scripts"
install: |
  ```bash
  mkdir -p ~/.claude/skills && cp -R orange-check* ~/.claude/skills/
  ```
  프로젝트 한정으로 쓰려면 `.claude/skills/` 아래에 둔다. 이후 "이 docx 참고문헌 검증해줘"처럼 요청하거나 `/orange-check`을 친다.
package: dir
