profile: codex
label: OpenAI Codex (CLI · IDE · 클라우드)
description_max: 1024
frontmatter_allow: [name, description, license, metadata]
flags: [shell, web, no_subagents, files, net_optin]
toolkit_cmd: "scripts -m refver"
toolkit_dir: "scripts"
install: |
  ```bash
  mkdir -p ~/.codex/skills && cp -R orange-check* ~/.codex/skills/
  ```
  샌드박스가 기본으로 네트워크를 막는다. 원문 PDF를 받아야 하면 네트워크 접근을 허용하고 실행하라. 막힌 상태면 스킬이 사용자에게 원문을 요청하는 방식으로 물러선다.
package: dir
