profile: chatgpt-work
label: ChatGPT for Work (Business · Enterprise)
description_max: 1024
frontmatter_allow: [name, description, license, metadata]
flags: [python_only, no_net_scripts, web, no_subagents, files, closed_corpus_hint]
toolkit_cmd: "scripts -m refver"
toolkit_dir: "scripts"
degraded_note: |
  **이 환경의 한계를 먼저 알린다.** 코드 실행 환경이 인터넷에 나갈 수 없다. 그래서
  원문 PDF를 스스로 받아 올 수 없다. 0단계를 마친 뒤 필요한 원문 목록을 한 번에 요청하고,
  올라온 것만 2단계로 판정한다. 나머지는 `INSUFFICIENT_EVIDENCE`로 남긴다.
  서지 실존 확인(1단계)은 모델의 웹 검색으로 대체로 가능하다.
install: |
  1. 대화에 `orange-check-chatgpt-work.zip`의 압축을 푼 폴더를 업로드하거나, 프로젝트 파일로 올린다.
  2. `SKILL.md`의 내용을 프로젝트 지침(또는 커스텀 GPT 지침)에 붙여 넣는다.
  3. 검증할 문서와 **출처 원문 PDF를 함께** 첨부한다 — 코드가 인터넷에서 받아 올 수 없기 때문이다.
package: zip
