name: orange-check
title: Orange Check
# description는 조각을 우선순위대로 이어 붙여 만든다.
# claude.ai는 200자 제한이라 뒤쪽 조각이 잘린다. 1번 조각만으로도 뜻이 통해야 한다.
description:
  - "이미 작성된 문서(보고서·논평·제안서·docx/pdf/hwp)의 참고문헌과 인용을 검증한다."
  - "출처가 실제로 존재하는지, 그리고 본문 주장을 그 출처가 실제로 뒷받침하는지를 원문 직접 판독과 쪽·행 핀포인트로 확인하고 대체 출처를 제시한다."
  - "\"참고문헌 검증\", \"레퍼런스 검증\", \"인용 검증\", \"출처 검증\", \"이 인용 맞는지 확인\" 같은 요청에 쓴다."
intro: |
  이미 완성된 문서의 **참고문헌과 인용을 검증한다.** 새 글을 쓰며 정확성을 강제하는 것이
  아니라, **남이(또는 AI가) 이미 써 놓은 인용이 맞는지**를 사후 검증하는 데 특화됐다.
fragments: [05-probe, 00-principle, 10-collect, 07-fast, 20-biblio, 30-slots, 40-support, 50-cove, 55-selfcheck, 60-replace, 65-judgment, 70-report]
references: [ref-report-contract, ref-pdf-retrieval]
outro: |
  ## 하위 스킬

  각 단계는 따로 쓸 수 있다. 한 단계만 손보고 싶거나, 결과를 사람이 중간에 고쳐 넣고
  싶을 때는 아래를 쓴다.

  - `orange-check-extract` — 인용 전수 수집만
  - `orange-check-support` — 주장·출처 쌍을 받아 적절성만 판정
  - `orange-check-judge` — 나온 검증 리포트를 채점
