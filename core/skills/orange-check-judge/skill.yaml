name: orange-check-judge
title: Orange Check — 검증 심판
description:
  - "참고문헌 검증 리포트가 얼마나 잘 됐는지 채점한다."
  - "근거가 실제로 그 자리에 있는지 원문을 다시 열어 확인하고, 판정이 슬롯 표에서 규칙대로 나왔는지, 인용을 빠뜨리지 않았는지 검사한 뒤 남은 부분만 판단으로 채점한다."
  - "검증 리포트 채점, 검증 품질 확인, 스킬 개선 요청에 쓴다."
intro: |
  스킬을 잘 만들려면 그 스킬이 몇 점짜리인지 재는 심판이 있어야 한다. 이 스킬이 그 심판이다.

  심판이 흔들리지 않게 하는 방법은 하나뿐이다. **판단해야 할 몫을 최대한 줄이는 것.**
  기계로 확인되는 것은 전부 기계에 넘기고, 남은 것만 판단한다.
